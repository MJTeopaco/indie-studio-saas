# render.yaml — Infrastructure as Code for Render
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: indie-studio-saas
    runtime: docker
    dockerfilePath: ./Dockerfile         # path relative to repo root
    dockerContext: .
    branch: main
    region: singapore                    # same region as your DB to avoid latency
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: IndieStudio

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      # Render injects the external URL automatically — we reference it here
      - key: APP_URL
        fromService:
          type: web
          name: indie-studio-saas
          property: host

      # Laravel app key — generate locally with: php artisan key:generate --show
      - key: APP_KEY
        sync: false     # must be set manually in Render dashboard

      # DB_CONNECTION must be 'central' to match tenancy.php's central_connection
      # so the bootstrapper knows which connection is the untouchable central one.
      - key: DB_CONNECTION
        value: central

      - key: DATABASE_URL
        fromDatabase:
          name: indie-studio-db
          property: connectionString

      # ── Cache / Queue (use database driver on free tier) ────────────────
      - key: CACHE_STORE
        value: database

      - key: SESSION_DRIVER
        value: database

      # Pin sessions to the central DB — never gets switched by the tenancy
      # bootstrapper, so tenant routes won't break with 'sessions' not found.
      - key: SESSION_CONNECTION
        value: central

      - key: QUEUE_CONNECTION
        value: database

      # ── Logging ─────────────────────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stderr        # Render streams stderr to its log viewer

      - key: LOG_LEVEL
        value: error

      # ── ML Engine URL (update after deploying to Hugging Face) ──────────
      - key: ML_ENGINE_URL
        value: http://127.0.0.1:8001   # placeholder — replace with HF Space URL

      - key: ML_ENGINE_SECRET
        sync: false          # set in dashboard — must match the HF Space secret

      # ── Mail Configuration (Gmail SMTP for reports & alerts) ───────────
      - key: MAIL_MAILER
        value: smtp

      - key: MAIL_HOST
        value: smtp.gmail.com

      - key: MAIL_PORT
        value: "587"

      - key: MAIL_USERNAME
        value: vaultera.studiosprint@gmail.com

      - key: MAIL_PASSWORD
        value: rifbppjrygniksbr

      - key: MAIL_ENCRYPTION
        value: tls

      - key: MAIL_FROM_ADDRESS
        value: vaultera.studiosprint@gmail.com

      - key: MAIL_FROM_NAME
        value: SprintStudio

databases:
  - name: indie-studio-db
    databaseName: indie_studio_db
    plan: free
    region: singapore
